<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>72-Hour Independent Forecast | Amateur Weather Watching</title>
  <meta name="description" content="Independent 72-hour forecasts for Central Kentucky and Upstate South Carolina from a shared, refreshable data source.">
  <style>
    :root {
      --ink: #102239;
      --muted: #5b6878;
      --line: #d7e1ea;
      --panel: #fff;
      --canvas: #eef4f8;
      --navy: #173d64;
      --blue: #1772b8;
      --teal: #167a78;
      --ok: #187553;
      --warn: #9b5b08;
      --error: #9f2525;
      --shadow: 0 12px 32px rgba(16, 34, 57, .10);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: var(--ink);
      background: radial-gradient(circle at 6% 0%, rgba(81,170,225,.18), transparent 28rem), linear-gradient(180deg,#f8fbfd 0%,var(--canvas) 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      padding: 12px;
    }
    button, a { font: inherit; }
    a { color: #0f609d; }
    a:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid #ffd970; outline-offset: 2px; }
    .widget { width: min(100%, 1180px); margin: 0 auto; overflow: hidden; background: rgba(255,255,255,.96); border: 1px solid rgba(23,61,100,.14); border-radius: 16px; box-shadow: var(--shadow); }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 72px; padding: 13px 16px; color: #fff; background: linear-gradient(120deg,#102f4f 0%,#175b8e 70%,#1476a7 100%); }
    .brand { min-width: 0; }
    h1 { margin: 0; font: 700 clamp(1.18rem,3vw,1.55rem)/1.15 Georgia,"Times New Roman",serif; }
    .subhead { margin-top: 4px; color: #dcecf7; font-size: .82rem; }
    .refresh { display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto; min-height: 40px; padding: 8px 12px; color: #fff; border: 1px solid rgba(255,255,255,.34); border-radius: 10px; background: rgba(255,255,255,.1); cursor: pointer; }
    .refresh:hover { background: rgba(255,255,255,.18); }
    .refresh:disabled { cursor: wait; opacity: .7; }
    .content { padding: 14px; }
    .statusbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 12px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 12px; background: #f7fafc; font-size: .82rem; }
    .statusbar strong { color: var(--navy); }
    .status { margin-left: auto; font-weight: 700; color: var(--ok); }
    .status.error { color: var(--error); }
    .headline { margin: 0 0 12px; font: 700 clamp(1.15rem,2.6vw,1.45rem)/1.25 Georgia,"Times New Roman",serif; color: var(--navy); }
    .regions { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; }
    .region { min-width: 0; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--panel); }
    .region[data-theme="blue"] { --accent: var(--blue); }
    .region[data-theme="teal"] { --accent: var(--teal); }
    .region-head { padding: 13px 14px 12px; color: #fff; background: linear-gradient(115deg,var(--navy),var(--accent)); }
    .region-head h2 { margin: 0; font-size: 1.12rem; }
    .region-head p { margin: 3px 0 0; color: rgba(255,255,255,.86); font-size: .8rem; }
    .region-body { padding: 12px; }
    .summary { margin: 0 0 11px; color: #2c4056; }
    .days { display: grid; gap: 9px; }
    .day { border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: 10px; padding: 10px 11px; background: #fbfdff; }
    .day-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; align-items: baseline; }
    .day h3 { margin: 0; font-size: .98rem; color: var(--navy); }
    .date { color: var(--muted); font-size: .74rem; }
    .numbers { display: flex; flex-wrap: wrap; gap: 7px; margin: 7px 0; }
    .pill { display: inline-flex; align-items: center; padding: 4px 7px; border-radius: 999px; background: #edf4f9; color: #24465f; font-size: .75rem; font-weight: 700; }
    .pill.rain { background: #e6f3fb; color: #0e5a8a; }
    .pill.hazard { background: #fff4df; color: #7f4b03; }
    .day p { margin: 0; color: #31475d; font-size: .88rem; }
    .bottom-line { margin: 11px 0 0; padding: 10px 11px; border-radius: 10px; background: #eef6f4; color: #244a43; font-size: .88rem; }
    .confidence { display: block; margin-top: 5px; font-weight: 700; }
    details { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    summary { cursor: pointer; padding: 9px 11px; color: var(--navy); font-weight: 750; }
    .detail-content { padding: 0 11px 11px; }
    .observations { display: grid; gap: 8px; }
    .observation { padding: 9px; border-radius: 8px; background: #f7fafc; font-size: .8rem; }
    .observation strong { display: block; color: var(--navy); }
    .observation span { display: block; margin-top: 2px; color: #40566c; }
    .links { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 9px; font-size: .8rem; }
    .shared { margin-top: 14px; }
    .model-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
    .model-card { overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: #f8fbfd; }
    .model-card img { display: block; width: 100%; height: auto; background: #e8eef3; aspect-ratio: 4/3; object-fit: contain; }
    .model-meta { padding: 9px 10px; font-size: .78rem; }
    .model-meta strong { display: block; color: var(--navy); }
    .model-meta span { display: block; margin-top: 2px; color: var(--muted); }
    .run-table { width: 100%; border-collapse: collapse; font-size: .78rem; }
    .run-table th, .run-table td { text-align: left; vertical-align: top; padding: 7px 6px; border-bottom: 1px solid var(--line); }
    .run-table th { color: var(--navy); }
    .run-table tr:last-child td { border-bottom: 0; }
    .ok { color: var(--ok); font-weight: 700; }
    .notes { margin: 0; padding-left: 20px; color: #40566c; font-size: .82rem; }
    .notes li + li { margin-top: 6px; }
    .verification { padding: 10px 11px; border-radius: 10px; background: #f7f3ff; color: #4c3e65; font-size: .82rem; }
    .verification strong { color: #382c52; }
    .disclaimer { margin: 12px 2px 0; color: var(--muted); font-size: .75rem; }
    .only-one .regions { grid-template-columns: 1fr; }
    .only-one .region[hidden] { display: none; }
    @media (max-width: 820px) { .regions, .model-grid { grid-template-columns: 1fr; } }
    @media (max-width: 560px) { body { padding: 0; } .widget { border-radius: 0; border-left: 0; border-right: 0; } .topbar { align-items: flex-start; } .refresh span { display: none; } .status { width: 100%; margin-left: 0; } }
  </style>
</head>
<body>
  <main class="widget" id="widget" aria-live="polite">
    <header class="topbar">
      <div class="brand">
        <h1>72-Hour Independent Forecast</h1>
        <div class="subhead">Central Kentucky · Upstate South Carolina</div>
      </div>
      <button class="refresh" id="refresh" type="button" aria-label="Refresh forecast data"><span>Refresh</span> ↻</button>
    </header>
    <div class="content">
      <div class="statusbar">
        <span><strong>Issued:</strong> <span id="issued">Loading…</span></span>
        <span><strong>Valid:</strong> <span id="valid">Loading…</span></span>
        <span class="status" id="status">Loading shared data…</span>
      </div>
      <h2 class="headline" id="headline"></h2>
      <section class="regions" id="regions" aria-label="Regional forecasts"></section>
      <section class="shared">
        <details>
          <summary>Current model runs and backup sources</summary>
          <div class="detail-content"><div id="model-status"></div></div>
        </details>
        <details>
          <summary>Timestamped model panels</summary>
          <div class="detail-content"><div class="model-grid" id="model-images"></div></div>
        </details>
        <details>
          <summary>Source notes and analysis links</summary>
          <div class="detail-content"><ul class="notes" id="source-notes"></ul><div class="links" id="analysis-links"></div></div>
        </details>
        <details>
          <summary>24 / 48 / 72-hour verification record</summary>
          <div class="detail-content"><div class="verification" id="verification"></div></div>
        </details>
      </section>
      <p class="disclaimer" id="disclaimer"></p>
    </div>
  </main>
  <script>
    "use strict";
    const DATA_URL = "forecast.json";
    const params = new URLSearchParams(location.search);
    const requestedRegion = params.get("region");
    const regionMap = { kentucky: "kentucky", ky: "kentucky", upstate: "upstate", sc: "upstate" };
    const singleRegion = regionMap[requestedRegion] || null;
    const widget = document.getElementById("widget");
    const refreshButton = document.getElementById("refresh");
    let refreshTimer = null;
    if (singleRegion) widget.classList.add("only-one");

    const formatDateTime = (value) => new Intl.DateTimeFormat("en-US", {
      timeZone: "America/New_York", month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit", timeZoneName: "short"
    }).format(new Date(value));
    const formatDate = (value) => new Intl.DateTimeFormat("en-US", { timeZone: "UTC", month: "short", day: "numeric" }).format(new Date(`${value}T12:00:00Z`));
    const text = (tag, value, className) => { const node = document.createElement(tag); node.textContent = value ?? ""; if (className) node.className = className; return node; };
    const link = (label, url) => { const node = text("a", label); node.href = url; node.target = "_blank"; node.rel = "noopener noreferrer"; return node; };

    function buildRegion(key, region) {
      const section = document.createElement("article");
      section.className = "region";
      section.dataset.theme = region.theme;
      if (singleRegion && singleRegion !== key) section.hidden = true;
      const head = text("header", "", "region-head");
      head.append(text("h2", region.name), text("p", region.subtitle));
      const body = text("div", "", "region-body");
      body.append(text("p", region.summary, "summary"));
      const days = text("div", "", "days");
      for (const day of region.days) {
        const card = text("section", "", "day");
        const dayHead = text("div", "", "day-head");
        dayHead.append(text("h3", day.label), text("span", formatDate(day.date), "date"));
        const numbers = text("div", "", "numbers");
        numbers.append(text("span", `High ${day.highF}° · Low ${day.lowF}°`, "pill"));
        numbers.append(text("span", `Precip ${day.precipitation}`, "pill rain"));
        numbers.append(text("span", day.hazard, "pill hazard"));
        card.append(dayHead, numbers, text("p", day.forecast));
        days.append(card);
      }
      body.append(days);
      const bottom = text("p", region.bottomLine, "bottom-line");
      bottom.append(text("span", `Confidence: ${region.confidence}`, "confidence"));
      body.append(bottom);
      const obs = document.createElement("details");
      obs.append(text("summary", "Current observations used"));
      const obsContent = text("div", "", "detail-content observations");
      for (const item of region.currentConditions) {
        const box = text("div", "", "observation");
        box.append(link(item.site, item.sourceUrl));
        const parts = [];
        if (item.observedAt) parts.push(formatDateTime(item.observedAt));
        if (item.temperatureF != null) parts.push(`${item.temperatureF}°F`);
        if (item.dewpointF != null) parts.push(`dewpoint ${item.dewpointF}°F`);
        if (item.wind) parts.push(item.wind);
        if (parts.length) box.append(text("span", parts.join(" · ")));
        if (item.condition) box.append(text("span", item.condition));
        if (item.precipitation) box.append(text("span", item.precipitation));
        obsContent.append(box);
      }
      obs.append(obsContent);
      body.append(obs);
      const live = text("div", "", "links");
      for (const item of region.radarLinks || []) live.append(link(item.label, item.url));
      body.append(live);
      section.append(head, body);
      return section;
    }

    function render(data) {
      document.getElementById("issued").textContent = formatDateTime(data.issuedAt);
      document.getElementById("valid").textContent = formatDateTime(data.validThrough);
      document.getElementById("headline").textContent = data.headline;
      document.getElementById("disclaimer").textContent = data.disclaimer;
      const regions = document.getElementById("regions");
      regions.replaceChildren();
      for (const [key, region] of Object.entries(data.regions)) regions.append(buildRegion(key, region));

      const modelWrap = document.getElementById("model-status");
      const table = text("table", "", "run-table");
      const thead = document.createElement("thead");
      const hr = document.createElement("tr");
      for (const heading of ["Model", "Verified run", "Forecast use", "Sources"]) hr.append(text("th", heading));
      thead.append(hr); table.append(thead);
      const tbody = document.createElement("tbody");
      for (const model of data.modelStatus) {
        const tr = document.createElement("tr");
        const modelCell = document.createElement("td"); modelCell.append(text("strong", model.model), text("div", model.status, "ok"));
        tr.append(modelCell, text("td", model.run), text("td", model.use));
        const sources = document.createElement("td"); sources.append(link("Primary", model.primaryUrl), document.createTextNode(" · "), link("Backup", model.backupUrl)); tr.append(sources);
        tbody.append(tr);
      }
      table.append(tbody); modelWrap.replaceChildren(table);

      const images = document.getElementById("model-images"); images.replaceChildren();
      for (const item of data.modelImages) {
        const card = text("article", "", "model-card");
        const imageLink = link(`${item.model} ${item.field}`, item.url);
        const image = document.createElement("img"); image.src = item.url; image.alt = `${item.model} ${item.field}, run ${item.run}, valid ${item.valid}`; image.loading = "lazy"; image.referrerPolicy = "no-referrer";
        imageLink.replaceChildren(image);
        const meta = text("div", "", "model-meta"); meta.append(text("strong", `${item.model} · ${item.field}`), text("span", `Run ${item.run} · Valid ${item.valid}`), text("span", item.note));
        card.append(imageLink, meta); images.append(card);
      }

      const notes = document.getElementById("source-notes"); notes.replaceChildren(...data.sourceNotes.map((note) => text("li", note)));
      const analysis = document.getElementById("analysis-links"); analysis.replaceChildren();
      for (const item of data.analysisLinks) analysis.append(link(item.label, item.url));
      const verification = document.getElementById("verification");
      verification.replaceChildren(text("strong", "Original issue locked. "), document.createTextNode("Verification uses official observations only: KDVK/KLEX for Central Kentucky and KCEU/KLQK for the Upstate; Tempest is excluded. "));
      for (const item of data.verification.checkpoints) verification.append(text("span", `${item.hours}h due ${formatDateTime(item.due)} — ${item.status}. `));
      verification.append(link("Open machine-readable history", data.verification.historyUrl));
      const seconds = Number(data.refresh?.seconds) || 300;
      clearInterval(refreshTimer); refreshTimer = setInterval(load, seconds * 1000);
    }

    async function load() {
      const status = document.getElementById("status");
      refreshButton.disabled = true; status.className = "status"; status.textContent = "Refreshing…";
      try {
        const response = await fetch(`${DATA_URL}?v=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        render(data);
        status.textContent = `Shared data loaded · ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
      } catch (error) {
        status.className = "status error";
        status.textContent = `Refresh failed — last loaded forecast remains visible`;
        console.error("Forecast refresh failed", error);
      } finally { refreshButton.disabled = false; }
    }
    refreshButton.addEventListener("click", load);
    load();
  </script>
</body>
</html>
